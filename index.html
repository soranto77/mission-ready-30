<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name=theme-color content="#0c1110"><meta name=apple-mobile-web-app-capable content=yes><meta name=apple-mobile-web-app-status-bar-style content=black-translucent><meta name=apple-mobile-web-app-title content="Mission Ready 30"><title>Mission Ready 30</title><style>
:root{--bg:#0c1110;--p:#151c19;--p2:#1b2420;--t:#f3f6f4;--m:#9fb0a7;--a:#d3ef63;--l:#2a3530}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:max(14px,env(safe-area-inset-top)) 14px max(28px,env(safe-area-inset-bottom))}h1{font-size:30px;letter-spacing:-1px;margin:8px 0 2px}.sub,.muted{color:var(--m)}.card{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:16px;margin:14px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:var(--p2);border-radius:13px;padding:12px}.n{font-size:24px;font-weight:800}.lab{font-size:11px;color:var(--m)}.bar{height:8px;background:#27302c;border-radius:9px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:var(--a)}.days{display:flex;gap:8px;overflow-x:auto;padding:4px 1px 8px;scrollbar-width:none}.days::-webkit-scrollbar{display:none}button{font:inherit}.d{min-width:44px;height:44px;border:1px solid var(--l);border-radius:12px;background:var(--p2);color:var(--t);font-weight:800}.d.on{outline:2px solid var(--a)}.d.done{background:var(--a);color:#111}.d.lock{opacity:.3}.phase{font-size:11px;letter-spacing:1.3px;color:var(--a);font-weight:800}h2{font-size:27px;margin:6px 0}h3{font-size:14px;margin:18px 0 8px;border-top:1px solid var(--l);padding-top:15px}ul{padding-left:20px}li{margin:9px 0;line-height:1.45}.carry{background:var(--p2);border-left:3px solid var(--a);padding:11px;border-radius:9px}textarea,input{width:100%;font:16px system-ui;background:#0f1512;color:var(--t);border:1px solid var(--l);border-radius:12px;padding:12px}textarea{min-height:90px}.pain{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.pain button{min-height:44px;border:1px solid var(--l);border-radius:10px;background:var(--p2);color:var(--t)}.pain .sel{border-color:var(--a);color:var(--a)}.go{width:100%;min-height:52px;border:0;border-radius:14px;background:var(--a);color:#111;font-weight:900;margin-top:16px;position:sticky;bottom:calc(8px + env(safe-area-inset-bottom))}.tiny{font-size:12px;color:var(--m);line-height:1.4}@media(min-width:700px){h1{font-size:42px}} </style></head><body><main>
<h1>MISSION READY 30</h1><div class=sub>30 days. Useful strength. Better engine. No heroics.</div>
<div class=card><div class=stats><div class=stat><div class=n id=c>0</div><div class=lab>MISSIONS COMPLETE</div></div><div class=stat><div class=n id=s>0</div><div class=lab>CURRENT STREAK</div></div></div><div class=bar><i id=b></i></div><div class=days id=nav></div><div class=tiny>Progress is stored on this device in Safari.</div></div>
<div class=card id=lesson></div>
</main><script>
const D=[["Baseline Ready Check","Baseline","2 min walk|8 squats|6 reverse lunges/side","60 sec squats (2 reps in reserve)|60 sec step-ups|Plank up to 60 sec|6 min brisk walk","Smooth technique"],["Move Like a Soldier","Control","3 min walk|10 hip hinges|8 squats","Squat 3x8|Reverse lunge 2x6/side|Glute bridge 3x10|Dead bug 3x6/side","Control before speed"],["Core Under Control","Core","3 min walk|Cat-camel x6|Hip hinge x8","Dead bug 3x6/side|Bird dog 3x6/side|Side plank knees 3x20 sec/side|Glute bridge 2x12","Brace and breathe"],["Lower-Body Engine","Legs","4 min walk|8 squats|6 lunges/side","Squat 3x10|Step-up 3x8/side|Reverse lunge 3x6/side|Calf raise 3x12","Even pacing"],["Upper-Body Rehab","Elbow-safe strength","3 min walk|Scapular retraction x10|Gentle wrist range","Single-arm row 3x8/side|Rear-delt fly 2x10|Wrist rehab as prescribed|Dead bug 2x8/side","Protect the tendon"],["Patrol Walk","Aerobic base","2 min easy walk","20 min purposeful walk; every 5 min do 10 controlled squats","Finish with reserve"],["Recovery Review","Recover","5 min easy walk","Mobility 10 min|Optional easy walk 10–20 min|Review week 1","Consistency"],["Squat Volume","Strength endurance","4 min walk|8 squats|6 lunges/side","Squat 4x10|Step-up 3x10/side|Glute bridge 3x12|Calf raise 3x15","Quality volume"],["Core + Carry","Bracing","3 min walk|Dead bug x6/side","Dead bug 3x8/side|Side plank 3x25 sec/side|Bird dog 3x8/side|Suitcase carry 4x30 sec/side","Stay tall"],["Intervals I","Conditioning","5 min easy-brisk walk","8 rounds: 45 sec fast walk / 45 sec easy|Squat 2x10","Controlled intensity"],["Upper Strength II","Pulling","3 min walk|Scapular retraction x10","Single-arm row 3x8/side|Rear-delt fly 3x10|Wrist rehab as prescribed|Glute bridge 3x12","Strong, not irritated"],["Leg Circuit","Work capacity","4 min walk|8 squats","3 rounds: 10 squats, 8 step-ups/side, 6 reverse lunges/side, 10 calf raises","Steady transitions"],["Long Patrol","Aerobic endurance","2 min easy walk","25–30 min purposeful walk","Endurance, not exhaustion"],["Checkpoint","Retest","5 min easy walk","60 sec squats at Day 1 effort|Plank up to 60 sec|10–15 min easy walk","Notice progress"],["Density I","Work density","4 min walk|8 squats|6 lunges/side","10 min circuit: 8 squats, 6 step-ups/side, 6 dead bugs/side","Economy of movement"],["Intervals II","Conditioning","5 min easy-brisk walk","10 rounds: 60 sec fast walk / 60 sec easy","Repeatable effort"],["Carry + Core","Military trunk","4 min walk|Hip hinge x8","Suitcase carry 5x40 sec/side|Dead bug 3x8/side|Side plank 3x30 sec/side|Step-up 2x10/side","Own your posture"],["Upper Strength III","Progress carefully","3 min walk|Scapular retraction x10","Single-arm row 3x8|Rear-delt fly 3x10|Wrist rehab|Optional incline push-up 2x5 only if cleared/tolerated","Earn progression"],["Leg Endurance II","Leg capacity","4 min walk|10 squats","4 rounds: 12 squats, 8 reverse lunges/side, 10 step-ups/side","Clean reps tired"],["Patrol 35","Aerobic base","2 min easy walk","35 min purposeful walk","Build the engine"],["Recovery Review","Recover","5 min easy walk","Mobility 10 min|Optional 15 min easy walk|Review Days 15–20","Recover deliberately"],["Mission Circuit I","Integrated work","5 min walk|8 squats|6 lunges/side","4 rounds: 10 squats, 8 step-ups/side, 8 dead bugs/side, 30 sec carry/side","Stay composed"],["Intervals III","Harder repeats","5 min easy-brisk walk","8 rounds: 90 sec fast walk / 60 sec easy","Hard, controlled"],["Strength Check","Strength endurance","4 min walk|8 squats","Squat 3x15|Step-up 3x12/side|Row 3x8 if elbow allows|Side plank 3x30–40 sec/side","Strong fundamentals"],["Mission Circuit II","Density","5 min walk","12 min circuit: 8 squats, 6 reverse lunges/side, 8 step-ups/side, 6 bird dogs/side","Calm under load"],["Patrol 40","Longest patrol","2 min easy walk","40 min purposeful walk; hills optional","Durability"],["Upper + Core","Consolidate","3 min walk|Scapular retraction x10","Row 3x8|Rear-delt fly 3x10|Wrist rehab|Dead bug 3x10/side|Side plank 2x40 sec/side","Respect the trend"],["Dress Rehearsal","80% effort","5 min brisk walk|8 squats|6 lunges/side","2 rounds: 12 squats, 10 step-ups/side, 8 lunges/side, 30 sec plank|6 min brisk walk","Leave something in reserve"],["Taper","Freshness","10 min easy walk","Light mobility|1x8 squats|1x6 step-ups/side|1x20 sec plank","Fresh beats heroic"],["Final Mission","Retest","5 min progressive walk|8 squats","60 sec squats|60 sec step-ups|Plank up to 60 sec|6 min brisk walk","Mission accomplished"]],K='mr30';let S=JSON.parse(localStorage.getItem(K)||'null')||{done:[],sel:1,n:{},p:{},t:{}};const save=()=>localStorage.setItem(K,JSON.stringify(S));const unlock=n=>n==1||S.done.includes(n-1)||S.done.includes(n);function nav(){let x='';D.forEach((d,i)=>{let n=i+1;x+=`<button class="d ${S.done.includes(n)?'done':''} ${S.sel==n?'on':''} ${unlock(n)?'':'lock'}" onclick="pick(${n})">${S.done.includes(n)?'✓':n}</button>`});document.querySelector('#nav').innerHTML=x;document.querySelector('#c').textContent=S.done.length;let q=0;for(let i=1;i<=30&&S.done.includes(i);i++)q++;document.querySelector('#s').textContent=q;document.querySelector('#b').style.width=S.done.length/30*100+'%'}function pick(n){if(unlock(n)){S.sel=n;save();render()}}function list(s){return '<ul>'+s.split('|').map(x=>'<li>'+x+'</li>').join('')+'</ul>'}function render(){nav();let n=S.sel,d=D[n-1],prev=n>1?(S.t[n-1]||D[n-2][4]):'Establish a clean starting baseline.',pain=S.p[n]||'',note=S.n[n]||'',target=S.t[n]||d[4];document.querySelector('#lesson').innerHTML=`<div class=phase>DAY ${n} / 30</div><h2>${d[0]}</h2><div class=muted>${d[1]}</div><p class=carry><b>Carry-forward:</b> ${prev}</p><h3>WARM-UP</h3>${list(d[2])}<h3>MAIN MISSION</h3>${list(d[3])}${n==18?'<p class=carry><b>Elbow gate:</b> incline push-ups are optional. Skip if not cleared/tolerated or symptoms rise meaningfully.</p>':''}<h3>READINESS CHECK</h3><div class=pain><button data-p=g class="${pain=='g'?'sel':''}">🟢 Good</button><button data-p=a class="${pain=='a'?'sel':''}">🟠 Modify</button><button data-p=r class="${pain=='r'?'sel':''}">🔴 Recover</button></div><h3>AFTER-ACTION REVIEW</h3><textarea id=note placeholder="What did you notice?">${note}</textarea><h3>TOMORROW'S TARGET</h3><input id=target value="${target.replace(/"/g,'&quot;')}"><button class=go id=go>${S.done.includes(n)?'MISSION COMPLETED ✓':'COMPLETE MISSION'}</button>`;document.querySelectorAll('.pain button').forEach(x=>x.onclick=()=>{S.p[n]=x.dataset.p;save();render()});document.querySelector('#note').oninput=e=>{S.n[n]=e.target.value;save()};document.querySelector('#target').oninput=e=>{S.t[n]=e.target.value;save()};document.querySelector('#go').onclick=()=>{if(!S.done.includes(n))S.done.push(n);if(n<30)S.sel=n+1;save();render()}}render();
</script></body></html>
