<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name=theme-color content="#0c1110"><meta name=apple-mobile-web-app-capable content=yes><meta name=apple-mobile-web-app-status-bar-style content=black-translucent><meta name=apple-mobile-web-app-title content="Mission Ready 30"><title>Mission Ready 30</title><style>:root{--bg:#0c1110;--p:#151c19;--p2:#1b2420;--t:#f3f6f4;--m:#9fb0a7;--a:#d3ef63;--l:#2a3530;--blue:#9ed8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:max(14px,env(safe-area-inset-top)) 14px max(28px,env(safe-area-inset-bottom))}h1{font-size:30px;letter-spacing:-1px;margin:8px 0 2px}.sub,.muted{color:var(--m)}.card{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:16px;margin:14px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:var(--p2);border-radius:13px;padding:12px}.n{font-size:24px;font-weight:800}.lab{font-size:11px;color:var(--m)}.bar{height:8px;background:#27302c;border-radius:9px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:var(--a)}.days{display:flex;gap:8px;overflow-x:auto;padding:4px 1px 8px;scrollbar-width:none}.days::-webkit-scrollbar{display:none}button{font:inherit}.d{min-width:44px;height:44px;border:1px solid var(--l);border-radius:12px;background:var(--p2);color:var(--t);font-weight:800}.d.on{outline:2px solid var(--a)}.d.done{background:var(--a);color:#111}.d.lock{opacity:.3}.phase{font-size:11px;letter-spacing:1.3px;color:var(--a);font-weight:800}h2{font-size:27px;margin:6px 0}h3{font-size:14px;margin:18px 0 8px;border-top:1px solid var(--l);padding-top:15px}ul{padding-left:20px}li{margin:9px 0;line-height:1.45}.carry{background:var(--p2);border-left:3px solid var(--a);padding:11px;border-radius:9px}.physio{background:#152026;border:1px solid #2c4959;border-left:4px solid var(--blue);padding:13px;border-radius:11px;margin:14px 0}.physio b{color:var(--blue)}.baseline{background:#1f2116;border:1px solid #45482b;border-radius:12px;padding:13px;margin:14px 0}.badge{display:inline-block;font-size:10px;letter-spacing:.8px;font-weight:900;padding:5px 8px;border-radius:999px;background:#20333d;color:var(--blue);margin-left:7px}.pain{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.pain button{min-height:44px;border:1px solid var(--l);border-radius:10px;background:var(--p2);color:var(--t)}.pain .sel{border-color:var(--a);color:var(--a)}textarea,input{width:100%;font:16px system-ui;background:#0f1512;color:var(--t);border:1px solid var(--l);border-radius:12px;padding:12px}textarea{min-height:90px}.go{width:100%;min-height:52px;border:0;border-radius:14px;background:var(--a);color:#111;font-weight:900;margin-top:16px;position:sticky;bottom:calc(8px + env(safe-area-inset-bottom))}.tiny{font-size:12px;color:var(--m);line-height:1.45}@media(min-width:700px){h1{font-size:42px}}</style></head><body><main><h1>MISSION READY 30</h1><div class=sub>Rebuilt from your real Day 1 baseline. Build capacity first.</div><div class=card><div class=stats><div class=stat><div class=n id=c>0</div><div class=lab>MISSIONS COMPLETE</div></div><div class=stat><div class=n id=s>0</div><div class=lab>CURRENT STREAK</div></div></div><div class=bar><i id=b></i></div><div class=days id=nav></div><div class=tiny>Progress and notes stay on this device in Safari.</div></div><div class=card id=rehab></div><div class=card id=lesson></div></main><script>
const D=[
["Baseline — Done","Actual starting point","Completed","30 bodyweight squats in 60 sec|15 step-ups each side|16 kg goblet squat work|8 squats holding Robin (~15 kg)|8 lunges/side holding Robin|Plank 60 sec: hard brace for 45 sec + normal final 15 sec|Physio: 10 kg DB row, rear-delt flys as set, 4 kg wrist work","Baseline says: strength is there, work capacity is not yet. Reduce volume."],
["Recovery Reset","Recover","10–15 min easy walk only","Gentle mobility 5–8 min|No loaded squats|No lunges|No planks today","Finish feeling better than you started"],
["Physio + Easy Engine","Rehab / recovery","5 min easy walk","Physio block|Easy walk 10–15 min|Optional 1x6 bodyweight squats only if legs feel normal","Keep plenty in reserve"],
["Lower Body Re-entry","Light strength","5 min easy walk|6 bodyweight squats","Goblet squat 2x6 — 8 kg KB|Step-up 2x6/side|Glute bridge 2x8|Calf raise 2x10","Stop with 3–4 reps in reserve"],
["Core Re-entry","Light trunk","5 min easy walk","Dead bug 2x5/side|Bird dog 2x5/side|Side plank from knees 2x15 sec/side|Easy walk 10 min","No hard bracing marathon"],
["Physio + Patrol","Rehab / aerobic","5 min easy walk","Physio block|15–20 min purposeful walk","No extra leg work"],
["Recovery Review","Recover","10–20 min easy walk","Gentle mobility|Check legs, core and elbows|No testing","Ready beats wrecked"],
["Strength Foundation","Strength","5 min walk|6 squats","Goblet squat 2x8 — 8 kg|Step-up 2x7/side|Glute bridge 2x10","Comfortable quality reps"],
["Core + Carry","Bracing","5 min walk","Dead bug 2x6/side|Side plank knees 2x20 sec/side|Suitcase carry 3x25 sec/side — 8 kg","Stay tall"],
["Physio + Walk","Rehab","5 min walk","Physio block|15 min brisk-but-easy walk","Upper body quality only"],
["Light Circuit","Work capacity","5 min walk","2 rounds: 8 bodyweight squats, 6 step-ups/side, 6 glute bridges, 8 calf raises","Finish with reserve"],
["Easy Intervals","Conditioning","5 min easy walk","6 rounds: 45 sec brisk / 75 sec easy","Not a test"],
["Physio + Patrol","Rehab / aerobic","5 min walk","Physio block|20–25 min purposeful walk","Steady"],
["Checkpoint 1","Review","5 min walk","Bodyweight squat 1x12|Step-up 1x8/side|Plank 30 sec comfortable|10 min walk","Assess recovery, not max effort"],
["Strength Build","Strength","5 min walk|6 squats","Goblet squat 3x6 — 10 kg|Step-up 2x8/side|Glute bridge 2x10","Build slowly"],
["Core Build","Core","5 min walk","Dead bug 2x7/side|Bird dog 2x6/side|Side plank 2x20 sec/side|Suitcase carry 3x30 sec/side — 10 kg","Controlled brace"],
["Physio + Walk","Rehab","5 min walk","Physio block|20 min purposeful walk","Protect the elbows"],
["Lower Body II","Strength","5 min walk|6 squats","Goblet squat 3x7 — 10 kg|Reverse lunge 2x5/side bodyweight|Step-up 2x8/side","No Robin loading yet"],
["Intervals II","Conditioning","5 min walk","7 rounds: 60 sec brisk / 60 sec easy","Repeatable pace"],
["Physio + Core Lite","Rehab / trunk","5 min walk","Physio block|Dead bug 2x6/side|Side plank 2x20 sec/side","Do not grind"],
["Recovery Review","Recover","15–25 min easy walk","Gentle mobility|Review soreness trend","Recover deliberately"],
["Strength III","Strength","5 min walk|6 squats","Goblet squat 3x8 — 10 kg|Step-up 3x7/side|Suitcase carry 3x30 sec/side — 10 kg","Still leave reps"],
["Aerobic Build","Engine","5 min walk","25–30 min purposeful walk","Comfortably hard at most"],
["Physio + Trunk","Rehab / core","5 min walk","Physio block|Dead bug 2x8/side|Side plank 2x25 sec/side","Quality"],
["Mission Circuit","Integrated","5 min walk","3 rounds: 8 bodyweight squats, 7 step-ups/side, 6 reverse lunges/side, 20 sec carry/side — 10 kg","Calm transitions"],
["Patrol 30","Aerobic","5 min easy walk","30 min purposeful walk","Durability"],
["Physio + Strength Lite","Rehab / strength","5 min walk","Physio block|Goblet squat 2x8 — 10 kg|Glute bridge 2x10","Keep it tidy"],
["Dress Rehearsal","Moderate","5 min walk","2 rounds: 10 bodyweight squats, 8 step-ups/side, 6 lunges/side, 25 sec plank|5 min brisk walk","About 70–75%, not 100%"],
["Taper","Freshness","10–15 min easy walk","Light mobility only","Fresh legs and core"],
["Final Mission","Retest","5 min progressive walk","60 sec bodyweight squats — stop before form breaks|60 sec step-ups at controlled pace|Plank up to 45 sec with normal brace|6 min brisk walk","Compare with Day 1 without chasing exhaustion"]];
const PHYS_OLD=[1,3,8,10,15,17,22,24,29]; const PHYS_NEW=[6,13,20,27]; const PHYS=[...new Set([...PHYS_OLD,...PHYS_NEW])];
const K='mr30';let S=JSON.parse(localStorage.getItem(K)||'null')||{};S.done=Array.isArray(S.done)?S.done:[];S.sel=Number.isInteger(S.sel)&&S.sel>=1&&S.sel<=30?S.sel:1;S.n=S.n||{};S.p=S.p||{};S.t=S.t||{};S.completedOn=S.completedOn||{};const save=()=>localStorage.setItem(K,JSON.stringify(S));const localDay=(d=new Date())=>{let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),a=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${a}`};const dayDiff=(a,b)=>Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/86400000);function streak(){let ds=[...new Set(Object.values(S.completedOn))].sort();if(!ds.length)return 0;let last=ds[ds.length-1],today=localDay(),y=new Date();y.setDate(y.getDate()-1);let yesterday=localDay(y);if(last!==today&&last!==yesterday)return 0;let q=1;for(let i=ds.length-1;i>0;i--){if(dayDiff(ds[i],ds[i-1])===1)q++;else break}return q}const unlock=n=>n==1||S.done.includes(n-1)||S.done.includes(n);function nav(){let x='';D.forEach((d,i)=>{let n=i+1;x+=`<button class="d ${S.done.includes(n)?'done':''} ${S.sel==n?'on':''} ${unlock(n)?'':'lock'}" onclick="pick(${n})">${S.done.includes(n)?'✓':n}</button>`});navEl.innerHTML=x;c.textContent=S.done.length;s.textContent=streak();b.style.width=S.done.length/30*100+'%'}function pick(n){if(unlock(n)){S.sel=n;save();render()}}function list(s){return s==='Completed'?'<p class=muted>Completed before baseline reset.</p>':'<ul>'+s.split('|').map(x=>'<li>'+x+'</li>').join('')+'</ul>'}function rehabPanel(n){
  const isA=PHYS_OLD.includes(n), isB=PHYS_NEW.includes(n);
  const label=isA?'PHYSIO A TODAY':isB?'PHYSIO B TODAY':'PHYSIO REFERENCE';
  return `<div class=phase>LATEST PHYSIO PLAN</div>
  <h3 style="border:0;padding:0;margin:8px 0">ELBOW / WRIST REHAB <span class=badge>${label}</span></h3>
  <div class=tiny>Current structure: two existing-program sessions plus one new add-on session each week. Space them out where practical. Do not force both arms to use the same load.</div>
  <details ${(isA||isB)?'open':''} style="margin-top:12px">
    <summary style="cursor:pointer;font-weight:800;color:var(--blue);padding:8px 0">View physio exercises</summary>
    <div style="border-top:1px solid var(--l);padding:11px 0"><b>Physio A — existing program</b>
      <ul>
        <li><b>Single-arm row:</b> 12.5 kg, controlled prescribed reps.</li>
        <li><b>Wrist extension:</b> choose a load each side can control cleanly; the weaker side does not need to match the stronger side.</li>
        <li><b>Rear-delt fly:</b> current adjustable-dumbbell setup; strict form, no swinging or shrugging.</li>
        <li><b>Wrist rotation:</b> around 4 kg if clean; reduce for the weaker direction rather than forcing range or load.</li>
      </ul>
    </div>
    <div style="border-top:1px solid var(--l);padding:11px 0"><b>Physio B — new weekly add-on</b>
      <ul>
        <li><b>Thumbs-up lateral raise:</b> 2–3 kg, 3×8.</li>
        <li><b>Upright row to chest:</b> 5 kg, 3×8.</li>
        <li><b>Biceps curl:</b> start neutral and twist as you curl, 5 kg, 3×8.</li>
      </ul>
    </div>
    <div class=physio><b>LOAD &amp; RECOVERY RULES</b>
      <ul>
        <li>Increase weight gradually. A 1 kg jump is a large percentage increase at these loads.</li>
        <li>Keep exercise pain low and acceptable.</li>
        <li>Your wrist/elbow should return to its usual baseline within 24 hours.</li>
        <li>If a movement feels weak rather than painful, reduce the load to what that side can control.</li>
        <li>Do not force range or position when the weaker side cannot control it.</li>
      </ul>
    </div>
  </details>`;
}
function physio(n){
  if(PHYS_OLD.includes(n)) return '<div class=physio><b>PHYSIO A TODAY</b><p>Complete the existing-program block shown above. This is one of the two existing-program sessions for the week.</p></div>';
  if(PHYS_NEW.includes(n)) return '<div class=physio><b>PHYSIO B TODAY</b><p>Complete the new three-exercise add-on block shown above. This sits between your two existing-program sessions.</p></div>';
  return '';
}
function render(){
  nav();
  const n=S.sel;
  const d=D[n-1]||D[0];
  const pain=S.p[n]||'';
  const noteValue=S.n[n]||'';
  const targetValue=S.t[n]||d[4]||'';
  const tag=(PHYS_OLD.includes(n)||PHYS_NEW.includes(n))?'<span class="badge">PHYSIO</span>':'';
  const base=n===1?'<div class="baseline"><b>Baseline interpretation:</b> You demonstrated decent absolute strength, but the combined squat/lunge/step-up/plank volume was too much after a long lay-off. The reset targets work capacity and recovery first. Weighted “Robin reps” are paused for now.</div>':'';

  rehabEl.innerHTML=rehabPanel(n);
  lessonEl.innerHTML=`<div class="phase">DAY ${n} / 30 ${tag}</div><h2>${d[0]}</h2><div class="muted">${d[1]}</div>${base}<h3>WARM-UP</h3>${list(d[2])}<h3>MAIN MISSION</h3>${list(d[3])}${physio(n)}<h3>READINESS CHECK</h3><div class="pain"><button data-p="g" class="${pain==='g'?'sel':''}">🟢 Good</button><button data-p="a" class="${pain==='a'?'sel':''}">🟠 Modify</button><button data-p="r" class="${pain==='r'?'sel':''}">🔴 Recover</button></div><div class="tiny" style="margin-top:10px">If soreness is still making normal movement difficult, choose Recover and repeat an easy day rather than forcing the schedule. For wrist/elbow rehab, keep symptoms low and return to your normal baseline within 24 hours.</div><h3>AFTER-ACTION REVIEW</h3><textarea id="note" placeholder="What did you notice?">${noteValue}</textarea><h3>TOMORROW'S TARGET</h3><input id="target" value="${String(targetValue).replace(/"/g,'&quot;')}"><button class="go" id="go">${S.done.includes(n)?'MISSION COMPLETED ✓':'COMPLETE MISSION'}</button>`;

  lessonEl.querySelectorAll('.pain button').forEach(btn=>{
    btn.onclick=()=>{S.p[n]=btn.dataset.p;save();render()};
  });

  const noteEl=lessonEl.querySelector('#note');
  const targetEl=lessonEl.querySelector('#target');
  const goEl=lessonEl.querySelector('#go');

  if(noteEl) noteEl.oninput=e=>{S.n[n]=e.target.value;save()};
  if(targetEl) targetEl.oninput=e=>{S.t[n]=e.target.value;save()};
  if(goEl) goEl.onclick=()=>{
    if(!S.done.includes(n)){
      S.done.push(n);
      S.completedOn[n]=localDay();
    } else if(!S.completedOn[n]){
      S.completedOn[n]=localDay();
    }
    if(n<30) S.sel=n+1;
    save();
    render();
  };
}

const navEl=document.querySelector('#nav');
const lessonEl=document.querySelector('#lesson');
const rehabEl=document.querySelector('#rehab');
const c=document.querySelector('#c');
const s=document.querySelector('#s');
const b=document.querySelector('#b');

try{
  render();
}catch(err){
  console.error(err);
  if(rehabEl) rehabEl.innerHTML='<div class="phase">APP ERROR</div><p class="tiny">A saved-data or rendering error occurred. Refresh the page. If this remains, the app code needs repair.</p>';
}
</script></body></html>
